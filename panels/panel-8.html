<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3012">
  <title>Banner 8 — Contact | Universal Metals Pakistan Limited</title>

  <!-- All fonts are local .woff2 — no CDN dependency for Puppeteer -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panels/panel-8.css">

  <style>
    /* Browser preview: allow scrolling and fit-to-screen */
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }
  </style>
  <script>
    /* Auto-scale panel to fit browser viewport width.
       At Puppeteer's 3012px viewport this is a no-op (zoom=1). */
    function fitPanel() {
      document.documentElement.style.zoom = window.innerWidth / 3012;
    }
    window.addEventListener('DOMContentLoaded', fitPanel);
    window.addEventListener('resize', fitPanel);
  </script>
</head>
<body>

<main id="panel-8" class="panel panel--white" style="--panel-index: 7;">

  <!-- =========================================================
       TOP ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--top" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       RIGHT EDGE ACCENT STRIPE
       Marks the absolute END of the display wall.
       ========================================================= -->
  <div class="edge-stripe edge-stripe--right" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       FLOW SVG LAYER (globally disabled in layout.css)
       ========================================================= -->
  <div class="flow-svg-layer" aria-hidden="true"></div>

  <!-- =========================================================
       ZONE A — HEADER
       Small logo top-right only.
       ========================================================= -->
  <header class="zone-a" role="banner" aria-label="Company logo">

    <div class="zone-a-logo">
      <img
        src="../assets/images/branding/Logo.png"
        alt="Universal Metals Pakistan Limited"
        class="logo-image"
        width="72"
        height="auto"
        onerror="this.style.display='none';"
      >
    </div>

  </header>

  <!-- =========================================================
       ZONE B — HERO CTA
       "TALK TO US" — massive, copper, centred.
       Readable from 5 metres away.
       ========================================================= -->
  <section class="zone-b p8-hero" aria-label="Call to action">

    <h1 class="p8-cta-heading">Talk to Us</h1>

  </section>

  <!-- =========================================================
       ZONE C — WEBSITE + QR CODE
       URL large enough to read at distance.
       QR code beneath — replace SVG below with a real QR before print.
       ========================================================= -->
  <section class="zone-c p8-contact-zone" aria-label="Contact details">

    <a
      href="https://www.universalmetals.com.pk"
      class="p8-url"
      target="_blank"
      rel="noopener"
    >
      universalmetals.com.pk
    </a>

    <!-- QR code — replace this SVG with a real generated QR before final print export -->
    <div class="p8-qr-wrap" role="img" aria-label="QR code — scan to visit universalmetals.com.pk">
      <svg
        class="p8-qr-svg"
        width="600"
        height="600"
        viewBox="0 0 600 600"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <!-- White background -->
        <rect width="600" height="600" fill="#FFFFFF"/>

        <!-- ── Top-left finder pattern ── -->
        <rect x="30"  y="30"  width="110" height="110" rx="8" fill="none" stroke="#1A1208" stroke-width="12"/>
        <rect x="56"  y="56"  width="58"  height="58"  rx="4" fill="#1A1208"/>

        <!-- ── Top-right finder pattern ── -->
        <rect x="460" y="30"  width="110" height="110" rx="8" fill="none" stroke="#1A1208" stroke-width="12"/>
        <rect x="486" y="56"  width="58"  height="58"  rx="4" fill="#1A1208"/>

        <!-- ── Bottom-left finder pattern ── -->
        <rect x="30"  y="460" width="110" height="110" rx="8" fill="none" stroke="#1A1208" stroke-width="12"/>
        <rect x="56"  y="486" width="58"  height="58"  rx="4" fill="#1A1208"/>

        <!-- ── Centre alignment pattern ── -->
        <rect x="268" y="268" width="64"  height="64"  rx="5" fill="none" stroke="#1A1208" stroke-width="8"/>
        <rect x="284" y="284" width="32"  height="32"  rx="3" fill="#1A1208"/>

        <!-- ── Data modules (representational — replace with real QR before print) ── -->
        <g fill="#1A1208" opacity="0.9">
          <!-- Top strip between finders -->
          <rect x="172" y="42"  width="24" height="24" rx="3"/>
          <rect x="204" y="42"  width="24" height="24" rx="3"/>
          <rect x="252" y="42"  width="24" height="24" rx="3"/>
          <rect x="324" y="42"  width="24" height="24" rx="3"/>
          <rect x="396" y="42"  width="24" height="24" rx="3"/>

          <rect x="172" y="74"  width="24" height="24" rx="3"/>
          <rect x="228" y="74"  width="24" height="24" rx="3"/>
          <rect x="300" y="74"  width="24" height="24" rx="3"/>
          <rect x="372" y="74"  width="24" height="24" rx="3"/>
          <rect x="420" y="74"  width="24" height="24" rx="3"/>

          <rect x="204" y="106" width="24" height="24" rx="3"/>
          <rect x="252" y="106" width="24" height="24" rx="3"/>
          <rect x="348" y="106" width="24" height="24" rx="3"/>
          <rect x="396" y="106" width="24" height="24" rx="3"/>

          <!-- Left strip (between top-left and bottom-left finders) -->
          <rect x="42"  y="172" width="24" height="24" rx="3"/>
          <rect x="42"  y="204" width="24" height="24" rx="3"/>
          <rect x="42"  y="252" width="24" height="24" rx="3"/>
          <rect x="42"  y="300" width="24" height="24" rx="3"/>
          <rect x="42"  y="348" width="24" height="24" rx="3"/>
          <rect x="42"  y="396" width="24" height="24" rx="3"/>
          <rect x="74"  y="172" width="24" height="24" rx="3"/>
          <rect x="74"  y="228" width="24" height="24" rx="3"/>
          <rect x="74"  y="324" width="24" height="24" rx="3"/>
          <rect x="74"  y="396" width="24" height="24" rx="3"/>
          <rect x="106" y="204" width="24" height="24" rx="3"/>
          <rect x="106" y="276" width="24" height="24" rx="3"/>
          <rect x="106" y="348" width="24" height="24" rx="3"/>

          <!-- Right strip -->
          <rect x="486" y="172" width="24" height="24" rx="3"/>
          <rect x="486" y="228" width="24" height="24" rx="3"/>
          <rect x="486" y="300" width="24" height="24" rx="3"/>
          <rect x="486" y="372" width="24" height="24" rx="3"/>
          <rect x="514" y="204" width="24" height="24" rx="3"/>
          <rect x="514" y="252" width="24" height="24" rx="3"/>
          <rect x="514" y="324" width="24" height="24" rx="3"/>

          <!-- Centre scatter -->
          <rect x="168" y="168" width="24" height="24" rx="3"/>
          <rect x="204" y="204" width="24" height="24" rx="3"/>
          <rect x="168" y="252" width="24" height="24" rx="3"/>
          <rect x="216" y="300" width="24" height="24" rx="3"/>
          <rect x="168" y="348" width="24" height="24" rx="3"/>
          <rect x="204" y="396" width="24" height="24" rx="3"/>
          <rect x="372" y="168" width="24" height="24" rx="3"/>
          <rect x="420" y="216" width="24" height="24" rx="3"/>
          <rect x="348" y="252" width="24" height="24" rx="3"/>
          <rect x="396" y="300" width="24" height="24" rx="3"/>
          <rect x="372" y="348" width="24" height="24" rx="3"/>
          <rect x="420" y="396" width="24" height="24" rx="3"/>

          <!-- Bottom strip between bottom-left finder and right edge -->
          <rect x="172" y="486" width="24" height="24" rx="3"/>
          <rect x="228" y="486" width="24" height="24" rx="3"/>
          <rect x="276" y="486" width="24" height="24" rx="3"/>
          <rect x="348" y="486" width="24" height="24" rx="3"/>
          <rect x="420" y="486" width="24" height="24" rx="3"/>
          <rect x="468" y="486" width="24" height="24" rx="3"/>
          <rect x="516" y="486" width="24" height="24" rx="3"/>

          <rect x="172" y="516" width="24" height="24" rx="3"/>
          <rect x="252" y="516" width="24" height="24" rx="3"/>
          <rect x="300" y="516" width="24" height="24" rx="3"/>
          <rect x="372" y="516" width="24" height="24" rx="3"/>
          <rect x="444" y="516" width="24" height="24" rx="3"/>
          <rect x="516" y="516" width="24" height="24" rx="3"/>
        </g>
      </svg>
      <p class="p8-qr-caption">Scan to visit our website</p>
    </div>

  </section>

  <!-- =========================================================
       ZONE D — EMAIL FOOTER
       ========================================================= -->
  <section class="zone-d" aria-label="Email contact">

    <div class="contact-row">
      <a href="mailto:info@universalmetals.com.pk" class="contact-url">
        info@universalmetals.com.pk
      </a>
    </div>

  </section>

  <!-- =========================================================
       BOTTOM ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--bottom" role="presentation" aria-hidden="true"></div>

</main>

</body>
</html>
