<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3012">
  <title>Banner 3 — Enamelled Wire | Universal Metals Pakistan Limited</title>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panels/panel-3.css">

  <style>
    /* Browser preview: allow scrolling and fit-to-screen */
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }
  </style>
  <script>
    /* Auto-scale panel to fit browser viewport width.
       At Puppeteer's 3012px viewport this is a no-op (zoom=1). */
    function fitPanel() {
      document.documentElement.style.zoom = window.innerWidth / 3012;
    }
    window.addEventListener('DOMContentLoaded', fitPanel);
    window.addEventListener('resize', fitPanel);
  </script>
</head>
<body>

<main id="panel-3" class="panel panel--white" style="--panel-index: 2;">

  <!-- =========================================================
       TOP ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--top" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       LEFT EDGE ACCENT STRIPE
       ========================================================= -->
  <div class="edge-stripe edge-stripe--left" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       FLOW SVG LAYER (globally disabled in layout.css)
       ========================================================= -->
  <div class="flow-svg-layer" aria-hidden="true"></div>

  <!-- =========================================================
       ZONE A — HEADER
       "ENAMELLED WIRE" category title + small logo top-right
       ========================================================= -->
  <header class="zone-a" role="banner" aria-label="Company logo">

    <div class="zone-a-logo">
      <img
        src="../assets/images/branding/Logo.png"
        alt="Universal Metals Pakistan Limited"
        class="logo-image"
        width="72"
        height="auto"
        onerror="this.style.display='none';"
      >
    </div>

  </header>

  <!-- =========================================================
       ZONE B — COPPER ENAMELLED WIRE
       Photo left · Large product name right (centered)
       ========================================================= -->
  <section class="zone-b p3-product-zone" aria-labelledby="p3-copper-heading">

    <!-- Left: Product photo (transparent PNG — no background) -->
    <div class="p3-col p3-col--photo">
      <img
        src="../assets/images/products/copper-enamelled-wire-new.png"
        alt="Copper Enamelled Wire spool"
        class="p3-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

    <!-- Right: Product name, centered vertically and horizontally -->
    <div class="p3-col p3-col--text">
      <h1 id="p3-copper-heading" class="p3-product-name">
        Copper<br>Enamelled<br>Wire
      </h1>
    </div>

  </section>

  <!-- =========================================================
       ZONE C — ALUMINIUM ENAMELLED WIRE
       Large product name left (centered) · Photo right
       ========================================================= -->
  <section class="zone-c p3-product-zone p3-product-zone--alt" aria-labelledby="p3-al-heading">

    <!-- Left: Product name, centered vertically and horizontally -->
    <div class="p3-col p3-col--text">
      <h2 id="p3-al-heading" class="p3-product-name">
        Aluminium<br>Enamelled<br>Wire
      </h2>
    </div>

    <!-- Right: Product photo (transparent PNG — no background) -->
    <div class="p3-col p3-col--photo">
      <img
        src="../assets/images/products/aluminium-enamelled-wire-new.png"
        alt="Aluminium Enamelled Wire coil"
        class="p3-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

  </section>

  <!-- =========================================================
       ZONE D — FOOTER (pinned to panel bottom)
       ========================================================= -->
  <section class="zone-d" aria-label="Contact">

    <div class="contact-row">
      <a href="https://www.universalmetals.com.pk" class="contact-url" target="_blank" rel="noopener">
        universalmetals.com.pk
      </a>
    </div>

  </section>

  <!-- =========================================================
       BOTTOM ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--bottom" role="presentation" aria-hidden="true"></div>

</main>

</body>
</html>
