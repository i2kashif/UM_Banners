<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3012">
  <title>Banner 5 — Copper &amp; Aluminium Rod | Universal Metals Pakistan Limited</title>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panels/panel-5.css">

  <style>
    /* Browser preview: allow scrolling and fit-to-screen */
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }
  </style>
  <script>
    /* Auto-scale panel to fit browser viewport width.
       At Puppeteer's 3012px viewport this is a no-op (zoom=1). */
    function fitPanel() {
      document.documentElement.style.zoom = window.innerWidth / 3012;
    }
    window.addEventListener('DOMContentLoaded', fitPanel);
    window.addEventListener('resize', fitPanel);
  </script>
</head>
<body>

<main id="panel-5" class="panel panel--white" style="--panel-index: 4;">

  <!-- =========================================================
       TOP ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--top" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       FLOW SVG LAYER (globally disabled in layout.css)
       ========================================================= -->
  <div class="flow-svg-layer" aria-hidden="true"></div>

  <!-- =========================================================
       ZONE A — HEADER
       "PRODUCTS" (left-aligned) + small logo top-right
       Together with Panel 4 "OUR", reads "OUR PRODUCTS"
       centred across the 4-panel centre wall.
       ========================================================= -->
  <header class="zone-a" role="banner" aria-label="Section heading and company logo">

    <h2 class="p5-section-heading">PRODUCTS</h2>

  </header>

  <!-- =========================================================
       ZONE B — COPPER ROD
       Photo left · Large product name right (centred)
       ========================================================= -->
  <section class="zone-b p5-product-zone" aria-labelledby="p5-copper-rod-heading">

    <!-- Left: Product photo (transparent PNG — no background) -->
    <div class="p5-col p5-col--photo">
      <img
        src="../assets/images/products/ccr-copper-rod-ai-transparent.png"
        alt="CCR Copper Rod coil"
        class="p5-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

    <!-- Right: Product name, centred vertically and horizontally -->
    <div class="p5-col p5-col--text">
      <h1 id="p5-copper-rod-heading" class="p5-product-name">
        Copper<br>Rod
      </h1>
    </div>

  </section>

  <!-- =========================================================
       ZONE C — ALUMINIUM ROD
       Large product name left (centred) · Photo right
       ========================================================= -->
  <section class="zone-c p5-product-zone p5-product-zone--alt" aria-labelledby="p5-al-rod-heading">

    <!-- Left: Product name, centred vertically and horizontally -->
    <div class="p5-col p5-col--text">
      <h2 id="p5-al-rod-heading" class="p5-product-name">
        Aluminium<br>Rod
      </h2>
    </div>

    <!-- Right: Product photo (JPEG — mix-blend-mode removes white background) -->
    <div class="p5-col p5-col--photo">
      <img
        src="../assets/images/products/aluminium-rod-ai-transparent.png"
        alt="EC Grade Aluminium Rod coil"
        class="p5-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

  </section>

  <!-- =========================================================
       ZONE D — FOOTER (pinned to panel bottom)
       ========================================================= -->
  <!-- =========================================================
       BOTTOM ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--bottom" role="presentation" aria-hidden="true"></div>

</main>

</body>
</html>
