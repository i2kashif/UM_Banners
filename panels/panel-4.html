<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3012">
  <title>Banner 4 — Paper Covered Strip | Universal Metals Pakistan Limited</title>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panels/panel-4.css">

  <style>
    /* Browser preview: allow scrolling and fit-to-screen */
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }
  </style>
  <script>
    /* Auto-scale panel to fit browser viewport width.
       At Puppeteer's 3012px viewport this is a no-op (zoom=1). */
    function fitPanel() {
      document.documentElement.style.zoom = window.innerWidth / 3012;
    }
    window.addEventListener('DOMContentLoaded', fitPanel);
    window.addEventListener('resize', fitPanel);
  </script>
</head>
<body>

<main id="panel-4" class="panel panel--white" style="--panel-index: 3;">

  <!-- =========================================================
       TOP ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--top" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       FLOW SVG LAYER (globally disabled in layout.css)
       ========================================================= -->
  <div class="flow-svg-layer" aria-hidden="true"></div>

  <!-- =========================================================
       ZONE A — HEADER
       "OUR" (right-aligned) + small logo top-right
       Together with Panel 5 "PRODUCTS", reads "OUR PRODUCTS"
       centred across the 4-panel centre wall.
       ========================================================= -->
  <header class="zone-a" role="banner" aria-label="Section heading and company logo">

    <h2 class="p4-section-heading">OUR</h2>

    <div class="zone-a-logo">
      <img
        src="../assets/images/branding/Logo.png"
        alt="Universal Metals Pakistan Limited"
        class="logo-image"
        width="72"
        height="auto"
        onerror="this.style.display='none';"
      >
    </div>

  </header>

  <!-- =========================================================
       ZONE B — PAPER COVERED COPPER STRIP
       Photo left · Large product name right (centred)
       ========================================================= -->
  <section class="zone-b p4-product-zone" aria-labelledby="p4-pccs-heading">

    <!-- Left: Product photo (transparent PNG — no background) -->
    <div class="p4-col p4-col--photo">
      <img
        src="../assets/images/products/paper-covered-strip-ai-transparent.png"
        alt="Paper Covered Copper Strip coil"
        class="p4-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

    <!-- Right: Product name, centred vertically and horizontally -->
    <div class="p4-col p4-col--text">
      <h1 id="p4-pccs-heading" class="p4-product-name">
        Paper<br>Covered<br>Copper<br>Strip
      </h1>
    </div>

  </section>

  <!-- =========================================================
       ZONE C — PAPER COVERED ALUMINIUM STRIP
       Large product name left (centred) · Photo right
       ========================================================= -->
  <section class="zone-c p4-product-zone p4-product-zone--alt" aria-labelledby="p4-pcas-heading">

    <!-- Left: Product name, centred vertically and horizontally -->
    <div class="p4-col p4-col--text">
      <h2 id="p4-pcas-heading" class="p4-product-name">
        Paper<br>Covered<br>Aluminium<br>Strip
      </h2>
    </div>

    <!-- Right: Product photo (transparent PNG — no background) -->
    <div class="p4-col p4-col--photo">
      <img
        src="../assets/images/products/paper-covered-strip-ai-transparent.png"
        alt="Paper Covered Aluminium Strip coil"
        class="p4-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

  </section>

  <!-- =========================================================
       ZONE D — FOOTER (pinned to panel bottom)
       ========================================================= -->
  <section class="zone-d" aria-label="Contact">

    <div class="contact-row">
      <a href="https://www.universalmetals.com.pk" class="contact-url" target="_blank" rel="noopener">
        universalmetals.com.pk
      </a>
    </div>

  </section>

  <!-- =========================================================
       BOTTOM ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--bottom" role="presentation" aria-hidden="true"></div>

</main>

</body>
</html>
