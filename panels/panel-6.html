<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3012">
  <title>Banner 6 — Winding Wire &amp; Insulation | Universal Metals Pakistan Limited</title>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panels/panel-6.css">

  <style>
    /* Browser preview: allow scrolling and fit-to-screen */
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }
  </style>
  <script>
    /* Auto-scale panel to fit browser viewport width.
       At Puppeteer's 3012px viewport this is a no-op (zoom=1). */
    function fitPanel() {
      document.documentElement.style.zoom = window.innerWidth / 3012;
    }
    window.addEventListener('DOMContentLoaded', fitPanel);
    window.addEventListener('resize', fitPanel);
  </script>
</head>
<body>

<main id="panel-6" class="panel panel--white" style="--panel-index: 5;">

  <!-- =========================================================
       TOP ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--top" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       RIGHT EDGE ACCENT STRIPE
       Marks the END of the centre wall product zone.
       ========================================================= -->
  <div class="edge-stripe edge-stripe--right" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       FLOW SVG LAYER (globally disabled in layout.css)
       ========================================================= -->
  <div class="flow-svg-layer" aria-hidden="true"></div>

  <!-- =========================================================
       ZONE A — HEADER
       Small logo top-right only (no category title)
       ========================================================= -->
  <header class="zone-a" role="banner" aria-label="Company logo">

    <div class="zone-a-logo">
      <img
        src="../assets/images/branding/Logo.png"
        alt="Universal Metals Pakistan Limited"
        class="logo-image"
        width="72"
        height="auto"
        onerror="this.style.display='none';"
      >
    </div>

  </header>

  <!-- =========================================================
       ZONE B — SUBMERSIBLE COPPER WINDING WIRE
       Photo left · Large product name right (centred)
       ========================================================= -->
  <section class="zone-b p6-product-zone" aria-labelledby="p6-sub-heading">

    <!-- Left: Product photo (JPEG — mix-blend-mode removes white background) -->
    <div class="p6-col p6-col--photo">
      <img
        src="../assets/images/products/submersible-winding-wire-transparent.png"
        alt="Submersible Copper Winding Wire spool"
        class="p6-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

    <!-- Right: Product name, centred vertically and horizontally -->
    <div class="p6-col p6-col--text">
      <h1 id="p6-sub-heading" class="p6-product-name">
        Submersible<br>Winding<br>Wire
      </h1>
    </div>

  </section>

  <!-- =========================================================
       ZONE C — INSULATION MATERIALS
       Large product name left (centred) · Photo right
       ========================================================= -->
  <section class="zone-c p6-product-zone p6-product-zone--alt" aria-labelledby="p6-ins-heading">

    <!-- Left: Product name, centred vertically and horizontally -->
    <div class="p6-col p6-col--text">
      <h2 id="p6-ins-heading" class="p6-product-name">
        Insulation<br>Materials
      </h2>
    </div>

    <!-- Right: Product photo (transparent PNG — no background) -->
    <div class="p6-col p6-col--photo">
      <img
        src="../assets/images/products/film-composite-transparent.png"
        alt="Film Composite insulation material"
        class="p6-product-photo"
        onerror="this.style.opacity='0.15';"
      >
    </div>

  </section>

  <!-- =========================================================
       ZONE D — FOOTER (pinned to panel bottom)
       ========================================================= -->
  <section class="zone-d" aria-label="Contact">

    <div class="contact-row">
      <a href="https://www.universalmetals.com.pk" class="contact-url" target="_blank" rel="noopener">
        universalmetals.com.pk
      </a>
    </div>

  </section>

  <!-- =========================================================
       BOTTOM ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--bottom" role="presentation" aria-hidden="true"></div>

</main>

</body>
</html>
