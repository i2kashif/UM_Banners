<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3012">
  <title>Banner 7 — Why Us | Universal Metals Pakistan Limited</title>

  <!-- All fonts are local .woff2 — no CDN dependency for Puppeteer -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panels/panel-7.css">

  <style>
    /* Browser preview: allow scrolling and fit-to-screen */
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }
  </style>
  <script>
    /* Auto-scale panel to fit browser viewport width.
       At Puppeteer's 3012px viewport this is a no-op (zoom=1). */
    function fitPanel() {
      document.documentElement.style.zoom = window.innerWidth / 3012;
    }
    window.addEventListener('DOMContentLoaded', fitPanel);
    window.addEventListener('resize', fitPanel);
  </script>
</head>
<body>

<main id="panel-7" class="panel panel--white" style="--panel-index: 6;">

  <!-- =========================================================
       TOP ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--top" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       LEFT EDGE ACCENT STRIPE
       Marks the START of the right wall.
       ========================================================= -->
  <div class="edge-stripe edge-stripe--left" role="presentation" aria-hidden="true"></div>

  <!-- =========================================================
       FLOW SVG LAYER (globally disabled in layout.css)
       ========================================================= -->
  <div class="flow-svg-layer" aria-hidden="true"></div>

  <!-- =========================================================
       ZONE A — HEADER
       Small logo top-right only.
       ========================================================= -->
  <header class="zone-a" role="banner" aria-label="Company logo">

  </header>

  <!-- =========================================================
       ZONE B — CREDENTIAL STATEMENTS 1–3
       Top half: market claim + CCR + sustainability
       ========================================================= -->
  <section class="zone-b p7-stack" aria-label="Company credentials">

    <!-- #1 — Market leadership -->
    <div class="p7-statement p7-statement--tier1" aria-label="Pakistan's largest copper rod producer">
      <span class="p7-line">Pakistan's Largest</span>
      <span class="p7-line">Copper Rod Producer</span>
    </div>

    <!-- #2 — CCR line -->
    <div class="p7-statement p7-statement--tier2" aria-label="In-house CCR line">
      <span class="p7-line">In-House CCR Line</span>
    </div>

    <!-- #3 — Sustainability -->
    <div class="p7-statement p7-statement--tier2" aria-label="Sustainably produced from recycled copper">
      <span class="p7-line">Sustainably Produced</span>
      <span class="p7-line">From Recycled Copper</span>
    </div>

  </section>

  <!-- =========================================================
       ZONE C — CREDENTIAL STATEMENTS 4–5
       Bottom half: trade advantage + certifications
       Separated by copper gradient divider (matches panels 3–6).
       ========================================================= -->
  <section class="zone-c p7-stack" aria-label="Trade advantages and certifications">

    <!-- #4 — Zero EU duty -->
    <div class="p7-statement p7-statement--tier2" aria-label="Zero EU import duty">
      <span class="p7-line">Zero EU Import Duty</span>
    </div>

    <!-- #5 — Certifications row -->
    <div class="p7-statement p7-statement--tier3" aria-label="GSP+ certified, ISO certified, CE mark">
      <span class="p7-line">GSP+ Certified &nbsp;&middot;&nbsp; ISO Certified &nbsp;&middot;&nbsp; CE Mark</span>
    </div>

  </section>

  <!-- =========================================================
       ZONE D — FOOTER
       ========================================================= -->
  <!-- =========================================================
       BOTTOM ACCENT BAR
       ========================================================= -->
  <div class="accent-bar accent-bar--bottom" role="presentation" aria-hidden="true"></div>

</main>

</body>
</html>
