<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3012">
  <title>Banner 7 — Why Us | Universal Metals Pakistan Limited</title>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panels/panel-7.css">

  <style>
    html, body { overflow-x: hidden; overflow-y: auto; height: auto; }
  </style>
  <script>
    function fitPanel() { document.documentElement.style.zoom = window.innerWidth / 3012; }
    window.addEventListener('DOMContentLoaded', fitPanel);
    window.addEventListener('resize', fitPanel);
  </script>
</head>
<body>

<main id="panel-7" class="panel panel--white" style="--panel-index: 6;">

  <div class="accent-bar accent-bar--top" role="presentation" aria-hidden="true"></div>
  <div class="edge-stripe edge-stripe--left" role="presentation" aria-hidden="true"></div>
  <div class="flow-svg-layer" aria-hidden="true"></div>

  <!-- =========================================================
       ZONE A — Header (empty)
       ========================================================= -->
  <header class="zone-a" role="banner" aria-label="Panel header">
    <h2 class="p7-heading">Why Universal Metals</h2>
  </header>

  <!-- =========================================================
       CREDENTIAL PLAQUE CARDS — 3 cards
       ========================================================= -->
  <div class="p7-grid" role="region" aria-label="Company credentials">

    <!-- Card 01 — Pakistan's Largest Producer -->
    <article class="p7-card" aria-label="Pakistan's largest copper rod, enamelled wire and paper covered strip producer">
      <span class="p7-card-ghost" aria-hidden="true">01</span>
      <div class="p7-card-body p7-card-body--pillars">
        <span class="p7-line p7-line--main">Pakistan's Largest</span>
        <div class="p7-pillars">

          <!-- Pillar: Copper Rod — cylinder icon -->
          <div class="p7-pillar">
            <svg class="p7-pillar-icon" width="360" height="360" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <ellipse cx="36" cy="14" rx="22" ry="8" stroke="#8B4A28" stroke-width="2.5" fill="#F5B880" fill-opacity="0.2"/>
              <line x1="14" y1="14" x2="14" y2="58" stroke="#8B4A28" stroke-width="2.5"/>
              <line x1="58" y1="14" x2="58" y2="58" stroke="#8B4A28" stroke-width="2.5"/>
              <ellipse cx="36" cy="58" rx="22" ry="8" stroke="#8B4A28" stroke-width="2.5" fill="#F5B880" fill-opacity="0.3"/>
              <line x1="24" y1="14" x2="24" y2="58" stroke="#F5B880" stroke-width="1.2" opacity="0.45"/>
            </svg>
            <span class="p7-pillar-name">Copper Rod</span>
          </div>

          <!-- Pillar: Enamelled Wire — coil icon -->
          <div class="p7-pillar">
            <svg class="p7-pillar-icon" width="360" height="360" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <ellipse cx="36" cy="14" rx="22" ry="7" stroke="#8B4A28" stroke-width="2" fill="#F5B880" fill-opacity="0.15"/>
              <path d="M14 14 C14 24 58 24 58 34 C58 44 14 44 14 54 C14 58 22 60 36 60 C50 60 58 58 58 54" stroke="#8B4A28" stroke-width="2" fill="none"/>
              <ellipse cx="36" cy="34" rx="22" ry="7" stroke="#8B4A28" stroke-width="1.5" fill="#FAF8F5" fill-opacity="0.55"/>
              <ellipse cx="36" cy="54" rx="22" ry="7" stroke="#8B4A28" stroke-width="2" fill="#F5B880" fill-opacity="0.28"/>
            </svg>
            <span class="p7-pillar-name">Enamelled Wire</span>
          </div>

          <!-- Pillar: Paper Covered Strip — layered rectangles icon -->
          <div class="p7-pillar">
            <svg class="p7-pillar-icon" width="360" height="360" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="10" y="13" width="52" height="12" rx="1.5" stroke="#8B4A28" stroke-width="2" fill="#F5B880" fill-opacity="0.15"/>
              <rect x="10" y="30" width="52" height="12" rx="1.5" stroke="#8B4A28" stroke-width="2" fill="#F5B880" fill-opacity="0.22"/>
              <rect x="10" y="47" width="52" height="12" rx="1.5" stroke="#8B4A28" stroke-width="2" fill="#F5B880" fill-opacity="0.32"/>
              <line x1="10" y1="15.5" x2="62" y2="15.5" stroke="#CE7340" stroke-width="0.8" opacity="0.45"/>
              <line x1="10" y1="32.5" x2="62" y2="32.5" stroke="#CE7340" stroke-width="0.8" opacity="0.45"/>
              <line x1="10" y1="49.5" x2="62" y2="49.5" stroke="#CE7340" stroke-width="0.8" opacity="0.45"/>
            </svg>
            <span class="p7-pillar-name">Paper Covered Strip</span>
          </div>

        </div>
      </div>
    </article>

    <!-- Card 02 — Sustainability -->
    <article class="p7-card" aria-label="Sustainably produced from recycled copper">
      <span class="p7-card-ghost" aria-hidden="true">02</span>
      <div class="p7-card-body p7-card-body--sustainability">

        <span class="p7-line p7-line--main">Sustainably Produced</span>
        <span class="p7-line p7-line--sub">From Recycled Copper</span>

        <div class="p7-rings-row" aria-label="Sustainability statistics">

          <!-- Ring 1 — 85% Less CO₂ -->
          <div class="p7-ring-wrap">
            <svg class="p7-ring-svg" width="540" height="540" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F5B880"/>
                  <stop offset="100%" stop-color="#8B4A28"/>
                </linearGradient>
              </defs>
              <circle cx="270" cy="270" r="220" fill="none" stroke="#F5B880" stroke-width="14" opacity="0.25"/>
              <circle cx="270" cy="270" r="220" fill="none"
                stroke="url(#rg1)" stroke-width="20" stroke-linecap="round"
                stroke-dasharray="1382.30" stroke-dashoffset="207.35"
                transform="rotate(-90 270 270)"/>
              <text x="270" y="262" text-anchor="middle"
                font-family="'Barlow Condensed', sans-serif" font-weight="800" font-size="168"
                fill="#8B4A28">85</text>
              <text x="270" y="348" text-anchor="middle"
                font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="62"
                fill="#CE7340">%</text>
            </svg>
            <p class="p7-ring-label">Less CO₂</p>
          </div>

          <!-- Ring 2 — 100% Recyclable -->
          <div class="p7-ring-wrap">
            <svg class="p7-ring-svg" width="540" height="540" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="rg2" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F5B880"/>
                  <stop offset="100%" stop-color="#8B4A28"/>
                </linearGradient>
              </defs>
              <circle cx="270" cy="270" r="220" fill="none" stroke="#F5B880" stroke-width="14" opacity="0.25"/>
              <circle cx="270" cy="270" r="220" fill="none"
                stroke="url(#rg2)" stroke-width="20" stroke-linecap="round"
                stroke-dasharray="1382.30" stroke-dashoffset="0"
                transform="rotate(-90 270 270)"/>
              <text x="270" y="268" text-anchor="middle"
                font-family="'Barlow Condensed', sans-serif" font-weight="800" font-size="130"
                fill="#8B4A28">100</text>
              <text x="270" y="348" text-anchor="middle"
                font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="62"
                fill="#CE7340">%</text>
            </svg>
            <p class="p7-ring-label">Recyclable</p>
          </div>

          <!-- Ring 3 — 3.9t CO₂ Saved -->
          <div class="p7-ring-wrap">
            <svg class="p7-ring-svg" width="540" height="540" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="rg3" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F5B880"/>
                  <stop offset="100%" stop-color="#8B4A28"/>
                </linearGradient>
              </defs>
              <circle cx="270" cy="270" r="220" fill="none" stroke="#F5B880" stroke-width="14" opacity="0.25"/>
              <circle cx="270" cy="270" r="220" fill="none"
                stroke="url(#rg3)" stroke-width="20" stroke-linecap="round"
                stroke-dasharray="1382.30" stroke-dashoffset="304.11"
                transform="rotate(-90 270 270)"/>
              <text x="270" y="262" text-anchor="middle"
                font-family="'Barlow Condensed', sans-serif" font-weight="800" font-size="168"
                fill="#8B4A28">3.9</text>
              <text x="270" y="348" text-anchor="middle"
                font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="52"
                fill="#CE7340">TONNES</text>
            </svg>
            <p class="p7-ring-label">CO₂ Saved / Tonne</p>
          </div>

        </div>
      </div>
    </article>

    <!-- Card 03 — Certifications -->
    <article class="p7-card" aria-label="International certifications">
      <span class="p7-card-ghost" aria-hidden="true">03</span>
      <div class="p7-card-body p7-card-body--sustainability">
        <span class="p7-line p7-line--main">Certifications</span>
        <div class="p7-seals-grid">
          <img class="p7-seal-img" src="../assets/images/certs/ISO_9001.svg"  alt="ISO 9001:2015 Quality Management">
          <img class="p7-seal-img" src="../assets/images/certs/ISO_14001.svg" alt="ISO 14001:2015 Environmental Management">
          <img class="p7-seal-img" src="../assets/images/certs/ISO_45001.svg" alt="ISO 45001:2018 Health &amp; Safety">
          <img class="p7-seal-img" src="../assets/images/certs/CE_Marking.svg" alt="CE Marking — EU Conformity">
        </div>
      </div>
    </article>

  </div>

  <div class="accent-bar accent-bar--bottom" role="presentation" aria-hidden="true"></div>

</main>

</body>
</html>
