<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ISO 9001 Quality Management System certification badge">
  <defs>
    <linearGradient id="bg9001" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE8D0"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
  </defs>
  <!-- Background fill -->
  <circle cx="100" cy="100" r="98" fill="url(#bg9001)"/>
  <!-- Outer border ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#8B4A28" stroke-width="3"/>
  <!-- Inner accent ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#CE7340" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#B2673E" stroke-width="2"/>
  <!-- Top arc path for text -->
  <path id="arc9001-top" d="M 24,100 A 76,76 0 0 1 176,100" fill="none"/>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#8B4A28" letter-spacing="1" text-anchor="middle">
    <textPath href="#arc9001-top" startOffset="50%">ISO 9001 : 2015</textPath>
  </text>
  <!-- Large standard number -->
  <text x="100" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#B2673E" letter-spacing="-1">9001</text>
  <!-- Descriptor lines -->
  <text x="100" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#1A1208" letter-spacing="2">QUALITY</text>
  <text x="100" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#4A3728" letter-spacing="1">MANAGEMENT</text>
  <!-- Bottom arc path for CERTIFIED text -->
  <path id="arc9001-bot" d="M 36,100 A 64,64 0 0 0 164,100" fill="none"/>
  <text font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#CE7340" letter-spacing="2" text-anchor="middle">
    <textPath href="#arc9001-bot" startOffset="50%">CERTIFIED</textPath>
  </text>
</svg>
